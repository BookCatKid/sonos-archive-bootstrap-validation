name: Diagnose independent historical indexes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Resume independent index discovery without payload acquisition
        run: |
          python -u - <<'PYTHON'
          import json
          from pathlib import Path
          from sonos_firmware.archive_index import discover_archives
          from sonos_firmware.retry import due
          from sonos_firmware.source_urls import sonos_url
          state = {}
          summaries = []
          for batch in range(12):
              state = discover_archives(state, pages=1, extensions=('upm','upd','exe','dmg','apk'), allowed=sonos_url)
              common = state['commoncrawl']
              summary = {'batch': batch, 'status': state['status'], 'manifest_urls': len(state['entries']),
                         'artifact_urls': len(state['artifacts']), 'collections': len(common.get('collections', {})),
                         'pending_queries': common.get('pending_queries'), 'errors': state['errors'],
                         'observations': state['observations']}
              summaries.append(summary)
              Path('historical-index-diagnostic.json').write_text(json.dumps({'state': state, 'batches': summaries}, indent=2))
              print(json.dumps(summary), flush=True)
              if not common.get('pending_queries') or not due(common.get('host_retry')):
                  break
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: historical-index-diagnostic
          path: historical-index-diagnostic.json
          retention-days: 14
