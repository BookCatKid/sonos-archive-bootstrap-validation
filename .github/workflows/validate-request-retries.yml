name: Validate request backoff and publication recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[google-play]'
      - name: Validate changed workers against synthetic and empty-archive fixtures
        run: |
          python scripts/run_tests.py --pattern test_app_archive.py
          python scripts/run_tests.py --pattern test_firmware_archive.py
          python scripts/run_tests.py --pattern test_discovery_retry.py
          python scripts/run_tests.py --pattern test_archive_index.py
          python scripts/run_tests.py --pattern test_commoncrawl.py
          python scripts/run_tests.py --pattern test_historical_firmware.py
          python scripts/run_tests.py --pattern test_empty_platform.py
