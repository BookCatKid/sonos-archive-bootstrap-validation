name: Validate consistency, ceiling and coverage audits

# This repository is an isolated archive: its data/ differs from production by
# design, so the full suite's production-evidence tests cannot run here. This
# job exercises the audits and the worker/retry tests that do not depend on
# production archive contents, on Python 3.12.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[google-play]'
      - name: Consistency audit
        run: python scripts/audit_repository_consistency.py
      - name: Discovery ceiling audit
        run: python scripts/audit_discovery_ceilings.py
      - name: GPL link coverage audit
        run: python scripts/audit_gpl_link_coverage.py --allow-unattempted
      - name: ConnectX coverage audit
        run: python scripts/audit_connectx_coverage.py
      - name: Release asset audit is self-consistent
        run: python scripts/run_tests.py --pattern test_release_audit.py
      - name: Consistency and ceiling tests
        run: |
          python scripts/run_tests.py --pattern test_repository_consistency.py
          python scripts/run_tests.py --pattern test_discovery_ceilings.py
      - name: Coverage recovery tests
        run: |
          python scripts/run_tests.py --pattern test_gpl_link_coverage.py
          python scripts/run_tests.py --pattern test_connectx_coverage.py
          python scripts/run_tests.py --pattern test_web_receipt_recovery.py
      - name: Retry, throttle and cold-start workers
        run: |
          python scripts/run_tests.py --pattern test_release_download.py
          python scripts/run_tests.py --pattern test_discovery_retry.py
          python scripts/run_tests.py --pattern test_empty_platform.py
          python scripts/run_tests.py --pattern test_platform_runner.py
      - name: Catalog verification
        run: python -m sonos_firmware.cli verify
