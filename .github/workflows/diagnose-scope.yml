name: Diagnose retained metadata scope
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    name: Replay scope from cached metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sonos-discovery-metadata/firmware
          key: scope-diagnostic-${{ github.run_id }}
          restore-keys: observations-firmware-
      - name: Profile pure metadata scope rebuilding
        run: |
          timeout 150 python -u - <<'PYCODE'
          import faulthandler, json, os, time
          from pathlib import Path
          from sonos_firmware.frontier import _distribution_scope
          faulthandler.dump_traceback_later(30, repeat=True)
          path = Path('data/discovery/firmware-frontier.json')
          started = time.monotonic()
          state = json.loads(path.read_text())
          evidence = Path(os.environ['RUNNER_TEMP'])/'sonos-discovery-metadata/firmware/manifests'
          print(json.dumps({'phase': 'loaded', 'seconds': time.monotonic()-started,
                            'metadata_bytes': path.stat().st_size,
                            'cache_files': sum(1 for p in evidence.glob('*') if p.is_file()),
                            'pending_before': len(state.get('pending_manifest_urls', []))}), flush=True)
          started = time.monotonic()
          retained = _distribution_scope(state, evidence)
          print(json.dumps({'phase': 'scope-complete', 'seconds': time.monotonic()-started,
                            'pending_after': sum(url in retained for url in state.get('pending_manifest_urls', [])),
                            'documents_after': sum(row['url'] in retained for row in state.get('documents', []))}), flush=True)
          faulthandler.cancel_dump_traceback_later()
          PYCODE
