name: Diagnose Aurora default anonymous session
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[google-play]'
      - name: Test the documented default-session GET endpoint
        run: |
          timeout 60 python -u - <<'PYCODE'
          import json
          from curl_cffi import requests
          from goopdl.auth import DEFAULT_DISPENSER_URL
          response = requests.get(DEFAULT_DISPENSER_URL,
              headers={'User-Agent': 'com.aurora.store-4.6.1-70', 'Accept': 'application/json'},
              impersonate='chrome', timeout=30, allow_redirects=False)
          try:
              result = {'phase': 'dispenser-default-get', 'http_status': response.status_code,
                        'content_type': response.headers.get('Content-Type', '').split(';')[0]}
              try:
                  bundle = response.json()
                  result['token_issued'] = isinstance(bundle, dict) and bool(bundle.get('authToken'))
              except (ValueError, AttributeError):
                  result['token_issued'] = False
              print(json.dumps(result), flush=True)
          finally:
              response.close()
          PYCODE
