name: Diagnose live Sonos protocol traversal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Compare headers and manifest traversal from protocol roots
        run: python -u tools/diagnose-protocol-manifests.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: protocol-manifest-diagnostic
          path: protocol-manifest-diagnostic.json
          retention-days: 14
